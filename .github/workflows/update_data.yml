name: Fetch Latest Storm Data

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs automatically every 4 hours
  workflow_dispatch:       # Allows you to trigger it manually anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install pandas requests

      - name: Run Data Fetcher
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python fetch_track.py
        
      - name: Commit and Push JSON
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add storm_track.json
          git diff-index --quiet HEAD || git commit -m "Auto-update storm tracking data"
          git push
