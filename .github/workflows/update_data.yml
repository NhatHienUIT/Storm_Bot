name: Scheduled Storm Sync

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs automatically every 4 hours
  workflow_dispatch:       # Allows manual trigger via "Run workflow" button

jobs:
  sync-storm-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python fetch_track.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add storm_track.json
          git diff-index --quiet HEAD || git commit -m "Auto-update storm tracking JSON"
          git push
